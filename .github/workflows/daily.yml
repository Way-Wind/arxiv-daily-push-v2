name: arxiv-daily-wechat
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  daily-digest:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
      WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
      WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
      ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES }}
      ARXIV_HOURS_BACK: ${{ vars.ARXIV_HOURS_BACK }}
      ARXIV_MAX_PAPERS: ${{ vars.ARXIV_MAX_PAPERS }}
      WECHAT_MODE: ${{ vars.WECHAT_MODE }}
      PAGE_BASE_URL: https://way-wind.github.io/arxiv-daily-push-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 生成网页和待发消息（优先恢复上次失败任务）
        run: |
          if [ ! -f pending_delivery.json ]; then
            python main.py --prepare-only
          fi
      - name: 保存待发任务和页面
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f pages/ last_pushed.json
          if [ -f pending_delivery.json ]; then git add -f pending_delivery.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: 保存 arXiv 页面和待发任务"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
      - name: 部署网页
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 网页上线后发送微信
        id: delivery
        run: python delivery.py
      - name: 保存已确认的发送结果（包括部分成功）
        if: ${{ always() && steps.delivery.outcome != 'skipped' && steps.delivery.outcome != '' }}
        run: |
          git add -f last_pushed.json
          if [ -f pending_delivery.json ]; then
            git add -f pending_delivery.json
          elif git ls-files --error-unmatch pending_delivery.json >/dev/null 2>&1; then
            git add -u -- pending_delivery.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: 保存微信发送结果"
            git push
          fi
